<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Làm Nhiệm Vụ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4 font-sans">
  <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-6">
    <h1 class="text-xl font-bold text-center text-cyan-400 uppercase tracking-wider">Cổng Nhiệm Vụ</h1>

    <!-- BƯỚC 1: TẠO LINK -->
    <div class="space-y-3 border-b border-slate-700 pb-5">
      <button id="btnGetLink" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-xl transition duration-200">
        1. Lấy Link Nhiệm Vụ
      </button>
      <div id="linkBox" class="hidden bg-slate-950 p-3 rounded-xl text-center space-y-2 border border-slate-800">
        <p id="shortUrl" class="text-xs text-cyan-300 font-mono break-all"></p>
        <button id="btnCopyLink" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded border border-slate-600 font-medium">
          Sao chép Link
        </button>
      </div>
    </div>

    <!-- BƯỚC 2: XÁC MINH MÃ -->
    <div class="space-y-3">
      <input id="inputCode" type="text" placeholder="NHẬP MÃ TỪ TRANG NHANMA..." class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl uppercase font-mono text-center text-slate-100 placeholder-slate-500 focus:outline-none focus:border-fuchsia-500">
      <button id="btnVerify" class="w-full bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-bold py-3 rounded-xl transition duration-200">
        2. Xác Nhận Mã
      </button>
      <p id="statusMsg" class="text-center text-xs font-bold min-h-[20px]"></p>
    </div>
  </div>

  <script>
    const btnGetLink = document.getElementById('btnGetLink');
    const btnCopyLink = document.getElementById('btnCopyLink');
    const btnVerify = document.getElementById('btnVerify');
    const linkBox = document.getElementById('linkBox');
    const shortUrl = document.getElementById('shortUrl');
    const inputCode = document.getElementById('inputCode');
    const statusMsg = document.getElementById('statusMsg');

    // 1. Gọi Serverless API tạo link
    btnGetLink.onclick = async () => {
      btnGetLink.innerText = "Đang tạo link bảo mật...";
      btnGetLink.disabled = true;

      try {
        const res = await fetch('/api/create-link', { method: 'POST' });
        const data = await res.json();

        if (res.ok && data.url) {
          shortUrl.innerText = data.url;
          linkBox.classList.remove('hidden');
        } else {
          alert(data.error || "Lỗi tạo link!");
        }
      } catch (err) {
        alert("Không thể kết nối đến Server API!");
      } finally {
        btnGetLink.innerText = "1. Lấy Link Nhiệm Vụ";
        btnGetLink.disabled = false;
      }
    };

    // Copy link
    btnCopyLink.onclick = () => {
      if (shortUrl.innerText) {
        navigator.clipboard.writeText(shortUrl.innerText);
        alert("Đã sao chép link!");
      }
    };

    // 2. Gọi Serverless API xác minh mã
    btnVerify.onclick = async () => {
      const code = inputCode.value.trim().toUpperCase();
      if (!code) return;

      statusMsg.className = "text-center text-xs font-bold text-yellow-400";
      statusMsg.innerText = "Đang kiểm tra trên Server...";
      btnVerify.disabled = true;

      try {
        const res = await fetch('/api/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          statusMsg.className = "text-center text-xs font-bold text-emerald-400";
          statusMsg.innerText = data.message || "Thành công! Phần thưởng đã mở khóa.";
          inputCode.value = "";
        } else {
          statusMsg.className = "text-center text-xs font-bold text-rose-400";
          statusMsg.innerText = data.error || "Mã không hợp lệ!";
        }
      } catch (err) {
        statusMsg.className = "text-center text-xs font-bold text-rose-400";
        statusMsg.innerText = "Lỗi kết nối Server!";
      } finally {
        btnVerify.disabled = false;
      }
    };
  </script>
</body>
</html>
