<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Link Nhiệm Vụ - Rút Gọn Tự Động</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-400 via-indigo-500 to-purple-600 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Đốm sáng trang trí nền -->
    <div class="absolute w-72 h-72 bg-white/20 rounded-full blur-3xl -top-10 -left-10 pointer-events-none"></div>
    <div class="absolute w-80 h-80 bg-purple-400/20 rounded-full blur-3xl -bottom-10 -right-10 pointer-events-none"></div>

    <!-- Container Chính Glassmorphism -->
    <div class="w-full max-w-lg bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10">
        
        <!-- Tiêu đề -->
        <div class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-wide">
                Tạo Link Nhiệm Vụ
            </h1>
            <p class="text-white/70 text-sm mt-1">
                Nhập liên kết để tạo đường dẫn rút gọn an toàn
            </p>
        </div>

        <!-- Form Tạo Link -->
        <form id="shortenForm" class="space-y-4">
            <div>
                <label for="originalUrl" class="block text-white/90 font-medium text-xs uppercase tracking-wider mb-2">
                    URL Gốc <span class="text-red-300">*</span>
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-white/40">
                        <i class="fa-solid fa-link"></i>
                    </span>
                    <input 
                        type="url" 
                        id="originalUrl" 
                        required 
                        placeholder="https://example.com/file-down-load..."
                        class="w-full bg-white/5 border border-white/20 text-white placeholder-white/40 rounded-xl py-3.5 pl-11 pr-4 focus:outline-none focus:ring-2 focus:ring-white/40 focus:bg-white/10 transition duration-200 text-sm"
                        autocomplete="off"
                    >
                </div>
            </div>

            <!-- Nút Tạo Link -->
            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl py-3.5 px-6 shadow-lg hover:shadow-indigo-500/30 transition duration-200 flex items-center justify-center space-x-2 text-sm sm:text-base cursor-pointer disabled:opacity-50"
            >
                <i id="btnIcon" class="fa-solid fa-wand-magic-sparkles"></i>
                <span id="btnText">Tạo Link</span>
            </button>
        </form>

        <!-- Thông báo lỗi (Khóa mặc định) -->
        <div id="errorBox" class="hidden mt-4 p-3.5 bg-red-500/20 border border-red-500/30 rounded-xl text-red-200 text-xs sm:text-sm flex items-center space-x-2">
            <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
            <span id="errorMsg">Đã xảy ra lỗi!</span>
        </div>

        <!-- Khu vực Kết quả (Khóa mặc định) -->
        <div id="resultBox" class="hidden mt-6 pt-6 border-t border-white/10 space-y-3">
            <label class="block text-emerald-300 font-semibold text-xs uppercase tracking-wider flex items-center space-x-1.5">
                <i class="fa-solid fa-circle-check"></i>
                <span>Link đã tạo thành công</span>
            </label>
            
            <input 
                type="text" 
                id="shortUrlResult" 
                readonly 
                class="w-full bg-black/20 border border-white/15 text-emerald-300 font-medium rounded-xl py-3 px-4 focus:outline-none text-sm select-all"
            >

            <!-- Nhóm Nút Bấm -->
            <div class="grid grid-cols-2 gap-3 pt-1">
                <button 
                    type="button" 
                    id="copyBtn"
                    class="bg-emerald-500/80 hover:bg-emerald-500 text-white font-medium rounded-xl py-2.5 px-4 transition duration-200 flex items-center justify-center space-x-2 text-sm shadow-md cursor-pointer"
                >
                    <i class="fa-regular fa-copy"></i>
                    <span id="copyBtnText">Sao chép</span>
                </button>

                <button 
                    type="button" 
                    id="openBtn"
                    class="bg-white/20 hover:bg-white/30 text-white font-medium rounded-xl py-2.5 px-4 border border-white/20 transition duration-200 flex items-center justify-center space-x-2 text-sm shadow-md cursor-pointer"
                >
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    <span>Mở tab mới</span>
                </button>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        const shortenForm = document.getElementById('shortenForm');
        const originalUrlInput = document.getElementById('originalUrl');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        const errorBox = document.getElementById('errorBox');
        const errorMsg = document.getElementById('errorMsg');

        const resultBox = document.getElementById('resultBox');
        const shortUrlResult = document.getElementById('shortUrlResult');
        const copyBtn = document.getElementById('copyBtn');
        const copyBtnText = document.getElementById('copyBtnText');
        const openBtn = document.getElementById('openBtn');

        // Xử lý gửi Form gọi Serverless Function
        shortenForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = originalUrlInput.value.trim();

            if (!url) return;

            hideAlerts();
            setLoading(true);

            try {
                // Gọi API Serverless được khởi tạo trong api/create-link.js
                const response = await fetch('/api/create-link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (data.success && data.shortUrl) {
                    shortUrlResult.value = data.shortUrl;
                    resultBox.classList.remove('hidden');
                } else {
                    showError(data.message || 'Không thể tạo link rút gọn.');
                }
            } catch (err) {
                showError('Lỗi kết nối tới máy chủ: ' + err.message);
            } finally {
                setLoading(false);
            }
        });

        // Sao chép link vào Clipboard
        copyBtn.addEventListener('click', async () => {
            if (!shortUrlResult.value) return;

            try {
                await navigator.clipboard.writeText(shortUrlResult.value);
                copyBtnText.textContent = 'Đã sao chép!';
                setTimeout(() => {
                    copyBtnText.textContent = 'Sao chép';
                }, 2000);
            } catch (err) {
                shortUrlResult.select();
                document.execCommand('copy');
                copyBtnText.textContent = 'Đã sao chép!';
                setTimeout(() => {
                    copyBtnText.textContent = 'Sao chép';
                }, 2000);
            }
        });

        // Mở link trong tab mới
        openBtn.addEventListener('click', () => {
            if (shortUrlResult.value) {
                window.open(shortUrlResult.value, '_blank');
            }
        });

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                btnText.textContent = 'Đang tạo link...';
                btnIcon.className = 'fa-solid fa-spinner animate-spin';
            } else {
                submitBtn.disabled = false;
                btnText.textContent = 'Tạo Link';
                btnIcon.className = 'fa-solid fa-wand-magic-sparkles';
            }
        }

        function hideAlerts() {
            errorBox.classList.add('hidden');
            resultBox.classList.add('hidden');
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
