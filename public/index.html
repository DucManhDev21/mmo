<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Link Rút Gọn Nhiệm Vụ - Link4M</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl -top-20 -left-20 pointer-events-none"></div>
    <div class="absolute w-96 h-96 bg-purple-500/20 rounded-full blur-3xl -bottom-20 -right-20 pointer-events-none"></div>

    <div class="w-full max-w-lg bg-white/10 backdrop-blur-xl border border-white/15 rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10">
        
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-500/20 text-indigo-400 mb-3 border border-indigo-500/30">
                <i class="fa-solid fa-wand-magic-sparkles text-xl"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                Tạo Link Nhiệm Vụ
            </h1>
            <p class="text-slate-400 text-xs sm:text-sm mt-1">
                Rút gọn liên kết nhanh chóng qua hệ thống Link4M
            </p>
        </div>

        <form id="shortenForm" class="space-y-4">
            <div>
                <label for="originalUrl" class="block text-slate-300 font-semibold text-xs uppercase tracking-wider mb-2">
                    URL Gốc <span class="text-rose-400">*</span>
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                        <i class="fa-solid fa-link text-sm"></i>
                    </span>
                    <input 
                        type="text" 
                        id="originalUrl" 
                        required 
                        placeholder="https://example.com/duong-dan-goc..."
                        class="w-full bg-slate-950/60 border border-slate-700/80 text-white placeholder-slate-500 rounded-xl py-3.5 pl-11 pr-4 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition duration-200 text-sm"
                        autocomplete="off"
                    >
                </div>
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-bold rounded-xl py-3.5 px-6 shadow-lg shadow-indigo-600/30 transition duration-200 flex items-center justify-center space-x-2 text-sm sm:text-base cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <i id="btnIcon" class="fa-solid fa-bolt"></i>
                <span id="btnText">Tạo Link Ngay</span>
            </button>
        </form>

        <div id="errorBox" class="hidden mt-4 p-3.5 bg-rose-500/15 border border-rose-500/30 rounded-xl text-rose-300 text-xs sm:text-sm flex items-start space-x-2.5">
            <i class="fa-solid fa-circle-exclamation flex-shrink-0 mt-0.5"></i>
            <span id="errorMsg">Đã xảy ra lỗi!</span>
        </div>

        <div id="resultBox" class="hidden mt-6 pt-6 border-t border-white/10 space-y-3">
            <label class="block text-emerald-400 font-semibold text-xs uppercase tracking-wider flex items-center space-x-1.5">
                <i class="fa-solid fa-circle-check"></i>
                <span>Link rút gọn của bạn:</span>
            </label>
            
            <input 
                type="text" 
                id="shortUrlResult" 
                readonly 
                class="w-full bg-slate-950 border border-slate-700 text-emerald-300 font-semibold rounded-xl py-3 px-4 focus:outline-none text-sm select-all cursor-pointer"
            >

            <div class="grid grid-cols-2 gap-3 pt-1">
                <button 
                    type="button" 
                    id="copyBtn"
                    class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl py-2.5 px-4 transition duration-200 flex items-center justify-center space-x-2 text-sm shadow-md cursor-pointer"
                >
                    <i id="copyIcon" class="fa-regular fa-copy"></i>
                    <span id="copyBtnText">Sao chép</span>
                </button>

                <button 
                    type="button" 
                    id="openBtn"
                    class="bg-white/10 hover:bg-white/20 text-white font-semibold rounded-xl py-2.5 px-4 border border-white/10 transition duration-200 flex items-center justify-center space-x-2 text-sm shadow-md cursor-pointer"
                >
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    <span>Mở tab mới</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        // DÁN URL GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY
        const GAS_WEB_APP_URL = 'DÁN_URL_GOOGLE_SCRIPT_TẠI_ĐÂY';

        const shortenForm = document.getElementById('shortenForm');
        const originalUrlInput = document.getElementById('originalUrl');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        const errorBox = document.getElementById('errorBox');
        const errorMsg = document.getElementById('errorMsg');

        const resultBox = document.getElementById('resultBox');
        const shortUrlResult = document.getElementById('shortUrlResult');
        const copyBtn = document.getElementById('copyBtn');
        const copyBtnText = document.getElementById('copyBtnText');
        const copyIcon = document.getElementById('copyIcon');
        const openBtn = document.getElementById('openBtn');

        shortenForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            let url = originalUrlInput.value.trim();
            if (!url) return;

            hideAlerts();
            setLoading(true);

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (data.success && data.shortUrl) {
                    shortUrlResult.value = data.shortUrl;
                    resultBox.classList.remove('hidden');
                } else {
                    showError(data.message || 'Không thể tạo link rút gọn.');
                }
            } catch (err) {
                showError('Lỗi kết nối tới Google Server: ' + err.message);
            } finally {
                setLoading(false);
            }
        });

        copyBtn.addEventListener('click', async () => {
            if (!shortUrlResult.value) return;

            try {
                await navigator.clipboard.writeText(shortUrlResult.value);
                setCopySuccess();
            } catch (err) {
                shortUrlResult.select();
                document.execCommand('copy');
                setCopySuccess();
            }
        });

        function setCopySuccess() {
            copyBtnText.textContent = 'Đã sao chép!';
            copyIcon.className = 'fa-solid fa-check';
            copyBtn.classList.replace('bg-emerald-600', 'bg-emerald-500');

            setTimeout(() => {
                copyBtnText.textContent = 'Sao chép';
                copyIcon.className = 'fa-regular fa-copy';
                copyBtn.classList.replace('bg-emerald-500', 'bg-emerald-600');
            }, 2000);
        }

        openBtn.addEventListener('click', () => {
            if (shortUrlResult.value) {
                window.open(shortUrlResult.value, '_blank');
            }
        });

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                btnText.textContent = 'Đang xử lý...';
                btnIcon.className = 'fa-solid fa-spinner animate-spin';
            } else {
                submitBtn.disabled = false;
                btnText.textContent = 'Tạo Link Ngay';
                btnIcon.className = 'fa-solid fa-bolt';
            }
        }

        function hideAlerts() {
            errorBox.classList.add('hidden');
            resultBox.classList.add('hidden');
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
